{% load static %}
<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#f4f7fe">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
    {% include "shared/favicon.html" %}
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    <title>{% block title %}Bliss Home{% endblock %}</title>
</head>
<body>
    <div class="auth-glow auth-glow-one" aria-hidden="true"></div>
    <div class="auth-glow auth-glow-two" aria-hidden="true"></div>
    <main class="auth-card">
        <a class="auth-brand" href="{% url 'login' %}" aria-label="Bliss Home">
            <img src="{% static 'branding/bliss-homestay-logo.jpg' %}" alt="" width="132" height="132">
        </a>
        {% include "shared/messages.html" %}
        <div class="auth-content">{% block content %}{% endblock %}</div>
        <p class="auth-footer">Vận hành lưu trú rõ ràng, an toàn và hiệu quả.</p>
    </main>
</body>
</html>
