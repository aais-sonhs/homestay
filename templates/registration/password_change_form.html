{% extends "housekeeping/base.html" %}
{% block title %}Đổi mật khẩu | Bliss Home{% endblock %}
{% block content %}
<div class="page-heading">
    <div><h1>Đổi mật khẩu</h1><p class="muted">Cập nhật mật khẩu cho tài khoản <strong>{{ request.user.username }}</strong>.</p></div>
    <a class="button secondary" href="{% url 'housekeeping:task-list' %}">Quay lại công việc</a>
</div>
<section class="card avatar-settings-card">
    <form class="stack-form" method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        <label class="field" for="{{ form.current_password.id_for_label }}"><span class="field-label">Mật khẩu hiện tại</span>{{ form.current_password }}{{ form.current_password.errors }}</label>
        <label class="field" for="{{ form.new_password.id_for_label }}"><span class="field-label">Mật khẩu mới</span>{{ form.new_password }}{{ form.new_password.errors }}</label>
        <label class="field" for="{{ form.confirm_password.id_for_label }}"><span class="field-label">Xác nhận mật khẩu mới</span>{{ form.confirm_password }}{{ form.confirm_password.errors }}</label>
        <div class="actions"><button type="submit">Lưu mật khẩu mới</button></div>
    </form>
</section>
{% endblock %}
