{% extends "registration/auth_base.html" %}
{% block title %}Đăng nhập | Bliss Home{% endblock %}
{% block content %}
<h1>Bliss Home</h1>
<p>Đăng nhập để tiếp tục.</p>
<form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <label for="{{ form.username.id_for_label }}">Tên đăng nhập</label>{{ form.username }}
    <label for="{{ form.password.id_for_label }}">Mật khẩu</label>{{ form.password }}
    <button type="submit">Đăng nhập</button>
</form>
<div class="actions"><a href="{% url 'forgot-password' %}">Quên mật khẩu?</a></div>
{% endblock %}
